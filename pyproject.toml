[project]
dependencies = [
  "ansible==12.3.0 ; python_full_version < '3.12'",
  "ansible==14.5.0 ; python_full_version >= '3.12'",
  "ansible-lint==26.10.1",
  "boto3==1.43.114",
  "botocore==1.43.114",
  "deepmerge==3.0.1",
  "docker==7.2.0",
  "dotenv-cli==3.4.1",
  "github3-py==4.0.1",
  "jmespath==1.1.0",
  "kubernetes==36.0.3",
  "lxml==6.1.3",
  "molecule==26.10.0",
  "molecule-plugins==26.10.12",
  "netaddr==1.3.0",
  "passlib==1.7.4",
  "podman==5.8.0",
  "psycopg2-binary==2.9.13",
  "pydantic==2.14.1",
  "ruamel-yaml==0.19.1",
  "typer==0.27.3",
  "urllib3==2.8.0",
  "xmltodict==1.0.4",
  "yamllint==1.38.0",
]
description = "Dependency management for PokerOps Ansible Actions devbox plugin"
name = "pokerops-ansible-utils"
requires-python = ">=3.11,<3.14"
version = "0.0.0"

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=45", "wheel"]

[tool.pyright]
reportMissingTypeStubs = false
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 160

[tool.setuptools]
packages = []
